name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release erstellen mit diesem Tag (z. B. v1.0.0) – leer lassen für nur bauen"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  sample-pdf:
    # Imports the sample catalog (real BrickLink numbers), loads the real
    # pictures from img.bricklink.com and builds an example checklist PDF.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DC_CHECKLIST_HOME: ${{ github.workspace }}/sample-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python app.py --cli import tests/fixtures/Minifigures_sample.txt
      - run: python app.py --cli list --all
      - run: python app.py --cli pdf Beispiel-Checkliste.pdf
      - run: ls -la sample-home/cache/img | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: Beispiel-PDF
          path: Beispiel-Checkliste.pdf

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DC-Minifig-Checkliste-Windows
          - os: macos-15
            artifact: DC-Minifig-Checkliste-macOS-AppleSilicon
          - os: macos-15-intel
            artifact: DC-Minifig-Checkliste-macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/DC-Minifig-Checkliste.exe out/
          Copy-Item packaging/LIESMICH.txt out/
          Compress-Archive -Path out/* -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R dist/DC-Minifig-Checkliste.app out/
          cp packaging/LIESMICH.txt out/
          ditto -c -k --sequesterRsrc out "${{ matrix.artifact }}.zip"

      - name: Self-test of the packaged app (import + PDF)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DC_CHECKLIST_HOME = "$PWD/selftest"
          Start-Process -Wait -FilePath dist/DC-Minifig-Checkliste.exe -ArgumentList "--cli","import","tests/fixtures/Minifigures_sample.txt","--no-images"
          Start-Process -Wait -FilePath dist/DC-Minifig-Checkliste.exe -ArgumentList "--cli","pdf","selftest.pdf","--no-images"
          Get-Content selftest/app.log -ErrorAction SilentlyContinue
          if (-not (Test-Path selftest.pdf)) { throw "PDF was not created" }
      - name: Self-test of the packaged app (import + PDF)
        if: runner.os == 'macOS'
        run: |
          export DC_CHECKLIST_HOME="$PWD/selftest"
          APP=dist/DC-Minifig-Checkliste.app/Contents/MacOS/DC-Minifig-Checkliste
          "$APP" --cli import tests/fixtures/Minifigures_sample.txt --no-images
          "$APP" --cli pdf selftest.pdf --no-images
          test -s selftest.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    # Runs for a pushed tag v*, for a manual run with a tag, or for a push whose
    # commit message contains "[release]" (version taken from the app).
    # A platform whose runner never starts must not block the others: the
    # release is made with every download that was built (a later run adds
    # missing ones, files with the same name are replaced).
    if: >-
      always() && needs.build.result != 'skipped' && (
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="v$(python3 -c 'import re;print(re.search(r"APP_VERSION = \"([^\"]+)\"", open("dcchecklist/config.py").read()).group(1))')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DC-Minifig-Checkliste-*
      - name: Check downloads
        shell: bash
        run: |
          ls -la artifacts/*/ || true
          ls artifacts/*/*.zip >/dev/null 2>&1 || { echo "no builds to release"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DC Minifiguren-Checkliste ${{ steps.tag.outputs.tag }}
          body_path: packaging/RELEASE_NOTES.md
          files: artifacts/**/*.zip
          make_latest: true
